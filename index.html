<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Longevidade Ativa</title>
    <style>
        /* Cores Temáticas em Tons de Azul-Bebê e Alto Contraste */
        :root {
            --bg-principal: #e3f2fd; 
            --bg-card: #ffffff;
            --texto-principal: #0d47a1; 
            --texto-secundario: #1565c0;
            --cor-primaria: #0d47a1;
            --cor-botoes: #1976d2;
            --cor-sucesso: #2e7d32;
            --cor-emergencia: #c62828;
            --borda: #bbdefb; 
        }

        .alto-contraste {
            --bg-principal: #000000;
            --bg-card: #121212;
            --texto-principal: #ffffff;
            --texto-secundario: #e0e0e0;
            --cor-primaria: #ffff00;
            --cor-botoes: #ffff00;
            --cor-sucesso: #00ff00;
            --cor-emergencia: #ff0000;
            --borda: #ffffff;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 22px; /* Fonte ligeiramente maior para o público */
            line-height: 1.6;
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }

        header {
            background-color: #b3e5fc; 
            border-bottom: 4px solid var(--cor-primaria);
            padding: 25px;
            text-align: center;
        }

        h1, h2, h3, h4 {
            color: var(--texto-principal);
            margin-top: 0;
        }

        .barra-acessibilidade {
            background-color: #0d47a1;
            color: #ffffff;
            padding: 10px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .btn-acessibilidade {
            font-size: 18px;
            font-weight: bold;
            padding: 12px 24px;
            margin: 5px;
            cursor: pointer;
            border-radius: 6px;
            background-color: #ffffff;
            color: #0d47a1;
            border: 2px solid #0d47a1;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background-color: var(--bg-card);
            border: 3px solid var(--borda);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(13, 71, 161, 0.1);
        }

        .painel-emergencia {
            background-color: #ffebee; 
            border: 4px solid var(--cor-emergencia);
        }

        /* Botões Maiores com ícone de som */
        .btn-grande {
            font-size: 24px;
            font-weight: bold;
            padding: 18px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
            display: inline-block;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-ouvir-secao {
            background-color: #0d47a1;
            color: white;
            font-size: 20px;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-danger { background-color: var(--cor-emergencia); color: white; }
        .btn-primary { background-color: var(--cor-botoes); color: white; }
        .btn-success { background-color: var(--cor-sucesso); color: white; }

        .campo-grupo { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--texto-secundario); }
        input, select {
            width: 100%; padding: 15px; font-size: 22px;
            border: 2px solid var(--borda); border-radius: 8px;
            background-color: var(--bg-card); color: #000;
            box-sizing: border-box;
        }

        .lista-itens { list-style: none; padding: 0; }
        .lista-itens li {
            background: #f1f8ff; padding: 15px; border-radius: 8px;
            margin-bottom: 12px; border-left: 6px solid var(--cor-primaria);
            display: flex; flex-direction: column; gap: 10px;
            color: #000;
        }
        
        .row-lista {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .btn-deletar { background-color: var(--cor-emergencia); color: white; border: none; padding: 8px 16px; font-size: 16px; border-radius: 6px; cursor: pointer; }
        .btn-ouvir-pequeno { background-color: #e3f2fd; color: #0d47a1; border: 2px solid #0d47a1; padding: 6px 12px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* CRONÔMETRO */
        .caixa-cronometro {
            background-color: #f1f8ff;
            border: 4px solid var(--borda);
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .cronometro-rodando { background-color: #e8f5e9; border-color: #2e7d32; }
        .cronometro-pausado { background-color: #fffde7; border-color: #fbc02d; }
        .cronometro-fim { background-color: #ffebee; border-color: var(--cor-emergencia); animation: piscar 0.5s infinite alternate; }

        @keyframes piscar { from { opacity: 1; } to { opacity: 0.6; } }

        .numeros-relogio {
            font-size: 75px; font-weight: bold; font-family: monospace; margin: 10px 0; color: #000;
        }

        .barra-progresso-container {
            background-color: #fff; border: 2px solid var(--borda); border-radius: 10px; height: 25px; width: 100%; margin-bottom: 20px; overflow: hidden;
        }
        .barra-progresso { background-color: #1976d2; height: 100%; width: 100%; transition: width 0.2s linear; }

        .botoes-tempo-grupo { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-tempo-ajuste {
            flex: 1; padding: 12px; font-size: 18px; font-weight: bold; cursor: pointer;
            background-color: #ffffff; border: 2px solid #1976d2; color: #1976d2; border-radius: 8px;
        }
        
        footer { text-align: center; padding: 40px; border-top: 3px solid var(--borda); font-size: 18px; color: var(--texto-secundario); }
    </style>
</head>
<body>

    <div class="barra-acessibilidade">
        <button class="btn-acessibilidade" onclick="alterarFonte(2)">A+ Letra Maior</button>
        <button class="btn-acessibilidade" onclick="alterarFonte(-2)">A- Letra Menor</button>
        <button class="btn-acessibilidade" onclick="alternarContraste()">Mudar Cores</button>
        <button class="btn-acessibilidade" style="background-color: #ff9100; color: black; border-color: #ff9100;" onclick="falarTexto('Bem-vindo ao portal. Toque nos botões azuis com o símbolo de alto-falante para ouvir o que está escrito na tela.')">🔊 Ouvir Ajuda Inicial</button>
    </div>

    <header>
        <h1>👵 Portal Longevidade Ativa 👴</h1>
        <p>Aperte os botões de som para escutar as opções.</p>
    </header>

    <div class="container">

        <!-- 1. EMERGÊNCIA -->
        <section class="card painel-emergencia">
            <button class="btn-ouvir-secao" onclick="falarTexto('Seção de contatos de emergência. O botão vermelho liga para o SAMU número 192 automaticamente.')">🔊 Ouvir o que é isso</button>
            <h2>🚨 Contatos de Emergência</h2>
            <button class="btn-grande btn-danger" onclick="window.location.href='tel:192'">📞 LIGAR PARA O SAMU (192)</button>
            
            <h3 style="margin-top: 25px;">Meus Telefones Salvos:</h3>
            <ul id="lista-contatos" class="lista-itens"></ul>
            
            <div style="background: rgba(13, 71, 161, 0.05); padding: 25px; border-radius: 10px; margin-top: 20px;">
                <h4>Adicionar Novo Contato:</h4>
                <input type="text" id="nome-contato" placeholder="Nome de quem vai ajudar" style="margin-bottom: 10px;">
                <input type="tel" id="tel-contato" placeholder="Número do Telefone">
                <button class="btn-grande btn-primary" onclick="adicionarContato()">Salvar Número</button>
            </div>
        </section>

        <!-- 2. REMÉDIOS -->
        <section class="card">
            <button class="btn-ouvir-secao" onclick="falarTexto('Seção de remédios. Aqui ficam marcados os seus remédios do dia e os horários de tomar.')">🔊 Ouvir o que é isso</button>
            <h2>💊 Meus Remédios</h2>
            <ul id="lista-remedios" class="lista-itens"></ul>
            <div style="background: rgba(13, 71, 161, 0.05); padding: 25px; border-radius: 10px; margin-top: 20px;">
                <h4>Adicionar Remédio:</h4>
                <input type="text" id="nome-remedio" placeholder="Nome do remédio" style="margin-bottom: 10px;">
                <label for="horario-remedio">Escolha as horas:</label>
                <input type="time" id="horario-remedio">
                <button class="btn-grande btn-success" onclick="adicionarRemedio()">Adicionar à Lista</button>
            </div>
        </section>

        <!-- 3. EXERCÍCIOS & CRONÔMETRO -->
        <section class="card">
            <button class="btn-ouvir-secao" onclick="falarTexto('Seção de exercícios físicos. Escolha uma atividade na caixinha para ouvir como fazer os movimentos com segurança.')">🔊 Ouvir o que é isso</button>
            <h2>👟 Exercícios Físicos</h2>
            <div class="campo-grupo">
                <label for="selecao-exercicio">Escolha uma atividade na lista:</label>
